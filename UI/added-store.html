<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-static@latest/lucide.js"></script>
    <title>FoodVault - Create Store</title>
  </head>

  <body
    class="bg-gray-100 flex items-center justify-center h-screen overflow-hidden"
  >
    <div class="flex gap-6">
      <!-- Phone Frame -->
      <div
        class="w-[360px] h-[720px] bg-white rounded-[40px] shadow-xl p-5 flex flex-col overflow-hidden"
      >
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
          <div>
            <h1 class="text-lg font-semibold">新增店铺</h1>
            <p class="text-xs text-gray-400">10 秒快速记录</p>
          </div>
          <img
            src="https://unpkg.com/lucide-static@latest/icons/x.svg"
            class="w-6 h-6"
          />
        </div>

        <!-- Quick Input -->
        <div class="bg-black text-white rounded-2xl p-4 mb-4">
          <div class="flex items-center gap-2 mb-2">
            <img
              src="https://unpkg.com/lucide-static@latest/icons/zap.svg"
              class="w-4 h-4"
            />
            <span class="text-sm font-medium">极速输入</span>
          </div>
          <input
            class="w-full bg-transparent text-sm outline-none placeholder-gray-400"
            placeholder="例如：海底捞 火锅 上海 4.5"
          />
          <p class="text-xs text-gray-400 mt-2">支持自然语言快速解析</p>
        </div>

        <!-- Structured Form -->
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500">店名</label>
            <input
              class="w-full mt-1 p-3 bg-gray-50 rounded-xl text-sm outline-none"
              placeholder="输入店铺名称"
            />
          </div>

          <div>
            <label class="text-xs text-gray-500">分类</label>
            <div class="grid grid-cols-3 gap-2 mt-1">
              <button class="bg-gray-100 py-2 rounded-xl text-xs">火锅</button>
              <button class="bg-gray-100 py-2 rounded-xl text-xs">烧烤</button>
              <button class="bg-gray-100 py-2 rounded-xl text-xs">咖啡</button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500">评分</label>
            <div class="flex gap-2 mt-1">
              <button class="flex-1 bg-gray-100 py-2 rounded-xl text-xs">
                ⭐ 3
              </button>
              <button class="flex-1 bg-gray-100 py-2 rounded-xl text-xs">
                ⭐ 4
              </button>
              <button
                class="flex-1 bg-black text-white py-2 rounded-xl text-xs"
              >
                ⭐ 5
              </button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500">人均消费</label>
            <input
              class="w-full mt-1 p-3 bg-gray-50 rounded-xl text-sm outline-none"
              placeholder="例如 80"
            />
          </div>

          <div>
            <label class="text-xs text-gray-500">备注</label>
            <input
              class="w-full mt-1 p-3 bg-gray-50 rounded-xl text-sm outline-none"
              placeholder="喜欢的菜 / 体验"
            />
          </div>
        </div>

        <!-- AI Assist -->
        <div class="mt-4 bg-gray-50 rounded-2xl p-3">
          <div class="flex items-center gap-2 mb-1">
            <img
              src="https://unpkg.com/lucide-static@latest/icons/sparkles.svg"
              class="w-4 h-4"
            />
            <span class="text-xs font-medium">AI 补全建议</span>
          </div>
          <p class="text-xs text-gray-500">
            检测到：火锅店，是否自动补充标签「聚餐 / 热门」？
          </p>
        </div>

        <!-- Submit -->
        <button class="mt-4 bg-black text-white py-3 rounded-2xl text-sm">
          保存店铺
        </button>

        <!-- Bottom Hint -->
        <p class="text-center text-xs text-gray-400 mt-2">支持 5 秒快速保存</p>
      </div>
    </div>
  </body>
</html>
