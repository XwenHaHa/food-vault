<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide-static@latest/lucide.js"></script>
    <title>FoodVault - Stats</title>
  </head>

  <body
    class="bg-gray-100 flex items-center justify-center h-screen overflow-hidden"
  >
    <div class="flex gap-6">
      <!-- Phone Frame -->
      <div
        class="w-[360px] h-[720px] bg-white rounded-[40px] shadow-xl p-5 flex flex-col overflow-hidden"
      >
        <!-- Header -->
        <div class="flex items-center justify-between mb-3">
          <div>
            <h1 class="text-lg font-semibold">美食画像</h1>
            <p class="text-xs text-gray-400">你的饮食偏好分析</p>
          </div>
          <img
            src="https://unpkg.com/lucide-static@latest/icons/bar-chart-3.svg"
            class="w-6 h-6"
          />
        </div>

        <!-- AI Summary -->
        <div class="bg-black text-white rounded-2xl p-4 mb-3">
          <div class="flex items-center gap-2 mb-1">
            <img
              src="https://unpkg.com/lucide-static@latest/icons/sparkles.svg"
              class="w-4 h-4"
            />
            <span class="text-sm font-medium">AI 画像总结</span>
          </div>
          <p class="text-xs text-gray-300">
            你是“火锅重度爱好者”，占比 58%，偏好高评分连锁品牌
          </p>
        </div>

        <!-- Category Chart -->
        <div class="bg-gray-50 rounded-2xl p-3 mb-3">
          <p class="text-xs text-gray-400 mb-2">分类分布</p>

          <div class="space-y-2">
            <div class="flex justify-between text-xs">
              <span>火锅</span>
              <span>58%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div class="bg-black h-2 rounded-full" style="width: 58%"></div>
            </div>

            <div class="flex justify-between text-xs">
              <span>饮品</span>
              <span>22%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div
                class="bg-gray-600 h-2 rounded-full"
                style="width: 22%"
              ></div>
            </div>

            <div class="flex justify-between text-xs">
              <span>烧烤</span>
              <span>20%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div
                class="bg-gray-400 h-2 rounded-full"
                style="width: 20%"
              ></div>
            </div>
          </div>
        </div>

        <!-- City Stats -->
        <div class="bg-gray-50 rounded-2xl p-3 mb-3">
          <p class="text-xs text-gray-400 mb-2">城市偏好</p>

          <div class="flex gap-2 flex-wrap">
            <span class="text-xs bg-black text-white px-3 py-1 rounded-full"
              >上海 45%</span
            >
            <span class="text-xs bg-gray-200 px-3 py-1 rounded-full"
              >北京 30%</span
            >
            <span class="text-xs bg-gray-200 px-3 py-1 rounded-full"
              >深圳 25%</span
            >
          </div>
        </div>

        <!-- Top Stores -->
        <div class="flex-1 overflow-hidden">
          <p class="text-xs text-gray-400 mb-2">最常访问</p>

          <div class="space-y-2">
            <div
              class="bg-gray-50 rounded-xl p-3 flex justify-between items-center"
            >
              <div>
                <p class="text-sm font-medium">海底捞</p>
                <p class="text-xs text-gray-400">访问 5 次</p>
              </div>
              <span class="text-xs bg-black text-white px-2 py-1 rounded-full"
                >TOP 1</span
              >
            </div>

            <div
              class="bg-gray-50 rounded-xl p-3 flex justify-between items-center"
            >
              <div>
                <p class="text-sm font-medium">喜茶</p>
                <p class="text-xs text-gray-400">访问 3 次</p>
              </div>
              <span class="text-xs bg-gray-200 px-2 py-1 rounded-full"
                >TOP 2</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
